<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="folio" content="5204160405358537"><meta name="sha" content="a4ff808e">
<meta name="trace" content="KRONOS-TRACE-PVA-5204160405358537-KRONOS-MT01JAAF">
<title>KRONOS MD-35 ULTRA</title>
<style>
    body,html{margin:0;padding:0;overflow:hidden;background:#000;font-family:monospace;color:#0fc}
    canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
    .hud{position:absolute;z-index:10;background:rgba(0,15,10,0.85);padding:14px;border:1px solid #0fc;border-radius:6px;font-size:11px;line-height:1.5;box-shadow:0 0 15px rgba(0,255,204,0.2)}
    #hud-izq{top:20px;left:20px;width:300px}
    #hud-der{top:20px;right:20px;width:300px;max-height:400px;overflow-y:auto}
    .btn{background:linear-gradient(90deg,#0fc,#0af);color:#000;border:none;padding:8px;width:100%;font-weight:bold;cursor:pointer;margin-top:8px;border-radius:3px}
    .btn:hover{background:#fff}
    .log{border-left:2px solid #0fc;padding:4px 6px;margin:4px 0;color:#8fd;font-size:10px;background:rgba(0,255,204,0.05)}
    .resaltado{color:#fff;font-weight:bold;text-shadow:0 0 5px #0fc}
    .titulo{color:#0fc;text-shadow:0 0 8px #0fc;letter-spacing:2px;font-weight:bold}
</style>
<script src="https://cloudflare.com"></script>
</head>
<body>
<div class="hud" id="hud-izq">
    <div class="titulo">◢ KRONOS MD-35 ULTRA ◣</div>
    <div>[NUCLEO]: <span class="resaltado">MT01JAAF a4ff808e</span></div>
    <div>[MODO]: <span id="txt-dimension" class="resaltado">3D PAISAJE ABSOLUTO</span></div>
    <div>[FPS]: <span id="fps">--</span></div>
    <div style="margin:8px 0;border-top:1px solid #0fc"></div>
    ESPACIO: Cristal | 1/2/3: Dimension<br>Q: Cuantico ON/OFF | WASD: Volar<br>
    <div style="font-size:7px;margin-top:8px;opacity:.7">TRACE: KRONOS-TRACE-PVA-5204160405358537<br>SHA: a4ff808e</div>
</div>
<div class="hud" id="hud-der">
    <div class="titulo">LEGADO 2099 - CAPTURAS</div>
    <div id="historial"></div>
</div>
<canvas id="canvas-kronos"></canvas>
<script>
let modoDimension=3, modoCuantico=false, nivelAudio=0;
const SHA="a4ff808e";
let lastTime=performance.now(), frameCount=0;

// Inicialización de escena Three.js
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({canvas: document.getElementById("canvas-kronos"), antialias: true, alpha: true});
renderer.setSize(window.innerWidth, window.innerHeight);
camera.position.z = 6;

let mouseX=0, mouseY=0;
window.addEventListener("mousemove", e => { mouseX=(e.clientX/window.innerWidth)*2-1; mouseY=-(e.clientY/window.innerHeight)*2+1; });

// Configuración de Partículas (Boids)
let COUNT=1000, geometry=new THREE.BufferGeometry(), positions=new Float32Array(COUNT*3), boids=[];
for(let i=0; i<COUNT; i++){
    positions[i*3]=(Math.random()-0.5)*8;
    positions[i*3+1]=(Math.random()-0.5)*5;
    positions[i*3+2]=(Math.random()-0.5)*5;
    boids.push({
        pos: new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]),
        estado0: new THREE.Vector3((Math.random()-0.5)*8, (Math.random()-0.5)*5, (Math.random()-0.5)*5),
        estado1: new THREE.Vector3(Math.cos(i)*2, Math.sin(i)*2, (Math.random()-0.5)*2),
        vel: new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02),
        fase: Math.random()*Math.PI*2
    });
}
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
let material = new THREE.PointsMaterial({color: 0x00ffcc, size: 0.04, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending});
let points = new THREE.Points(geometry, material);
scene.add(points);

// Cristales
let cristales=[], cristalGeo=new THREE.OctahedronGeometry(0.2, 0);
function crearCristal(){
    let idx = Math.floor(Math.random()*COUNT);
    let b = boids[idx];
    let mat = new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true, transparent: true, opacity: 0.9});
    let mesh = new THREE.Mesh(cristalGeo, mat);
    mesh.position.copy(b.pos);
    mesh.userData = {baseY: b.pos.y};
    scene.add(mesh);
    cristales.push(mesh);
}

function guardar(info){
    let r = JSON.parse(localStorage.getItem("kronos_legado")||"[]");
    r.unshift("["+new Date().toLocaleTimeString()+"] "+info);
    if(r.length>8) r.pop();
    localStorage.setItem("kronos_legado", JSON.stringify(r));
    renderHist();
}
function renderHist(){
    let r = JSON.parse(localStorage.getItem("kronos_legado")||"[]");
    document.getElementById("historial").innerHTML = r.map(x=>"<div class=log>"+x+"</div>").join("");
}
renderHist();

let teclas={};
window.addEventListener("keydown", e => {
    teclas[e.key.toLowerCase()]=true;
    if(e.key==="1"){modoDimension=1; document.getElementById("txt-dimension").innerText="1D FILAMENTO CUANTICO"; material.color.setHex(0x00ffcc);}
    if(e.key==="2"){modoDimension=2; document.getElementById("txt-dimension").innerText="2D BIG BANG COLECTIVO"; material.color.setHex(0xffffff);}
    if(e.key==="3"){modoDimension=3; document.getElementById("txt-dimension").innerText="3D PAISAJE ABSOLUTO"; material.color.setHex(0x00aaff);}
});
window.addEventListener("keyup", e => { teclas[e.key.toLowerCase()]=false; });

// Bucle de Animación principal
function animar(){
    requestAnimationFrame(animar);
    let now = performance.now();
    frameCount++;
    if(now - lastTime >= 1000){
        document.getElementById("fps").innerText = Math.round((frameCount*1000)/(now-lastTime));
        frameCount = 0; lastTime = now;
    }
    
    let posAttr = geometry.getAttribute("position");
    for(let i=0; i<COUNT; i++){
        let boid = boids[i];
        boid.fase += 0.01;
        if(modoDimension===1){ boid.pos.set((i/COUNT-0.5)*8, 0, 0); }
        else if(modoDimension===2){ boid.pos.set(Math.cos(boid.fase+i)*2.5, Math.sin(boid.fase+i)*2.5, 0); }
        else{
            boid.pos.add(boid.vel);
            if(Math.abs(boid.pos.x)>4) boid.vel.x *= -1;
            if(Math.abs(boid.pos.y)>3) boid.vel.y *= -1;
        }
        posAttr.setXYZ(i, boid.pos.x, boid.pos.y, boid.pos.z);
    }
    posAttr.needsUpdate = true;
    
    let speed = 0.05;
    if(teclas["w"]) camera.position.z -= speed;
    if(teclas["s"]) camera.position.z += speed;
    
    camera.position.x += (mouseX*3 - camera.position.x)*0.05;
    camera.position.y += (mouseY*3 - camera.position.y)*0.05;
    camera.lookAt(scene.position);
    
    cristales.forEach((mesh,idx)=>{
        mesh.rotation.y += 0.02;
        mesh.position.y = mesh.userData.baseY + Math.sin(performance.now()*0.002+idx)*0.1;
    });
    renderer.render(scene,camera);
}

// Enlace WebSocket adaptativo
const isCodespace = window.location.hostname.includes("github.dev") || window.location.hostname.includes("preview.app.github.dev");
const wsUrl = isCodespace ? "wss://" + window.location.hostname.replace("-8080", "-8765") : "ws://" + (window.location.hostname || "localhost") + ":8765";
try {
    const ws = new WebSocket(wsUrl);
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        crearCristal();
        guardar(data.msg);
    };
    ws.onopen = () => { guardar("CONEXIÓN CON EL NÚCLEO EMITIDA [" + SHA + "]"); };
} catch(e) { console.log(e); }

window.addEventListener("resize",()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
animar();
</script>
</body>
</html>
